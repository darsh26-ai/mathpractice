<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Math Adventure - Grades 1 to 7</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =====================================================
   BODY
===================================================== */

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #ffe6f0,
            #fff0f5
        );

    min-height:100vh;

    color:#243447;

}


/* =====================================================
   HEADER
===================================================== */

header{

    background:
        linear-gradient(
            135deg,
            #4f8cff,
            #7657e8
        );

    color:white;

    padding:24px 15px;

    text-align:center;

    box-shadow:
        0 4px 15px rgba(0,0,0,.15);

}

header h1{

    font-size:34px;

    margin-bottom:7px;

}

header p{

    font-size:16px;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    max-width:1100px;

    margin:25px auto;

    padding:0 15px;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background-color: #77dd77; /* Green */

    border-radius:18px;

    padding:25px;

    margin-bottom:20px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);

}


/* =====================================================
   SETUP
===================================================== */

.setup-title {
    background-color: #FFD218;

    color: black;

    padding: 18px 25px;

    border-radius: 16px;

    text-align: center;

    font-size: 26px;

    margin-bottom: 25px;

    box-shadow:
        0 6px 15px rgba(59,130,246,.25);
}

.option-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px,1fr)
        );

    gap:15px;

}

.option{

    border:2px solid #e2e8f0;

    border-radius:14px;

    padding:16px;

    background:#fff;

}

.option label{

    display:block;

    font-weight:bold;

    margin-bottom:9px;

}

select{

    width:100%;

    padding:12px;

    border-radius:10px;

    border:2px solid #dbe3ec;

    font-size:16px;

    background:white;

}


/* =====================================================
   TOPICS
===================================================== */

.topic-heading{

    margin-top:25px;

    margin-bottom:12px;

    font-size:20px;

}

.topic-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(145px,1fr)
        );

    gap:12px;

}

.topic-btn{

    border:2px solid #e1e7ef;

    background:white;

    border-radius:12px;

    padding:15px 8px;

    cursor:pointer;

    font-size:15px;

    font-weight:bold;

    transition:.2s;

}

.topic-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 4px 10px rgba(0,0,0,.08);

}

.topic-btn.selected{

    background:#4f8cff;

    color:white;

    border-color:#4f8cff;

}


/* =====================================================
   MAIN BUTTON
===================================================== */

.main-btn{

    width:100%;

    border:none;

    padding:16px;

    margin-top:25px;

    border-radius:12px;

    background-color: #FFD218;

    color:black;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

.main-btn:hover{

    transform:translateY(-1px);

}


/* =====================================================
   TEST HEADER
===================================================== */

.test-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:20px;

    flex-wrap:wrap;

}

.progress-area{

    flex:1;

    min-width:200px;

}

.progress-text{

    font-weight:bold;

    margin-bottom:7px;

}

.progress{

    height:12px;

    background:#e5e7eb;

    border-radius:20px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:
        linear-gradient(
            90deg,
            #4f8cff,
            #7657e8
        );

    transition:.3s;

}

.timer{

    background:#fff4e5;

    border:2px solid #ffb84d;

    padding:12px 18px;

    border-radius:12px;

    font-weight:bold;

    font-size:20px;

    min-width:120px;

    text-align:center;

}

.timer.warning{

    background:#ffe4e4;

    border-color:#ff6b6b;

    color:#d62828;

}


/* =====================================================
   QUESTION
===================================================== */

.question-number{

    color:#64748b;

    font-weight:bold;

    margin-bottom:10px;

    text-align:center;

}

.question{

    font-size:29px;

    font-weight:bold;

    text-align:center;

    padding:25px 10px;

    line-height:1.5;

}


/* =====================================================
   MULTIPLE CHOICE
===================================================== */

.answer-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );

    gap:15px;

    max-width:700px;

    margin:auto;

}

.answer-btn{

    padding:18px 12px;

    border:2px solid #dbe3ec;

    background:white;

    border-radius:12px;

    cursor:pointer;

    font-size:20px;

    font-weight:bold;

    transition:.2s;

}

.answer-btn:hover{

    border-color:#4f8cff;

    background:#eef5ff;

}

.answer-btn.selected{

    background:#4f8cff;

    border-color:#4f8cff;

    color:white;

}


/* =====================================================
   FILL IN BLANK
===================================================== */

.text-answer{

    max-width:430px;

    margin:20px auto;

    text-align:center;

}

.text-answer input{

    width:100%;

    padding:17px;

    border:3px solid #dbe3ec;

    border-radius:12px;

    font-size:24px;

    text-align:center;

    outline:none;

}

.text-answer input:focus{

    border-color:#4f8cff;

    box-shadow:
        0 0 0 4px
        rgba(79,140,255,.12);

}


/* =====================================================
   ANSWER TYPE LABEL
===================================================== */

.answer-mode-label{

    text-align:center;

    margin-top:10px;

    color:#64748b;

    font-size:14px;

}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation{

    display:flex;

    justify-content:space-between;

    gap:15px;

    margin-top:28px;

}

.nav-btn{

    flex:1;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

}

.previous{

    background:#e2e8f0;

    color:#334155;

}

.next{

    background:#4f8cff;

    color:white;

}


/* =====================================================
   CLOCK
===================================================== */

.clock-question{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.clock{

    width:230px;

    height:230px;

    border:10px solid #334155;

    border-radius:50%;

    position:relative;

    margin:15px auto;

    background:white;

    box-shadow:
        inset 0 0 0 3px #cbd5e1,
        0 5px 15px rgba(0,0,0,.15);

}

.clock-center{

    position:absolute;

    width:14px;

    height:14px;

    background:#334155;

    border-radius:50%;

    left:50%;

    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:5;

}

.hand{

    position:absolute;

    bottom:50%;

    left:50%;

    transform-origin:50% 100%;

    border-radius:10px;

}

.hour-hand{

    width:7px;

    height:60px;

    background:#334155;

}

.minute-hand{

    width:5px;

    height:85px;

    background:#4f8cff;

}

.clock-number{

    position:absolute;

    font-weight:bold;

    font-size:18px;

    transform:
        translate(-50%,-50%);

}

.clock-12{top:9%;left:50%}
.clock-1{top:17%;left:75%}
.clock-2{top:31%;left:89%}
.clock-3{top:50%;left:94%}
.clock-4{top:69%;left:89%}
.clock-5{top:83%;left:75%}
.clock-6{top:91%;left:50%}
.clock-7{top:83%;left:25%}
.clock-8{top:69%;left:11%}
.clock-9{top:50%;left:6%}
.clock-10{top:31%;left:11%}
.clock-11{top:17%;left:25%}


/* =====================================================
   RESULT
===================================================== */

.result{

    text-align:center;

}

.score-circle{

    width:160px;

    height:160px;

    border-radius:50%;

    margin:20px auto;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    background:#eef5ff;

    border:8px solid #4f8cff;

}

.score-number{

    font-size:40px;

    font-weight:bold;

    color:#4f8cff;

}

.result-message{

    font-size:24px;

    font-weight:bold;

    margin:15px;

}

.result-details{

    font-size:18px;

    margin-bottom:20px;

}


/* =====================================================
   REVIEW
===================================================== */

.review{

    margin-top:30px;

    text-align:left;

}

.review h2{

    margin-bottom:15px;

}

.review-item{

    padding:15px;

    border-radius:12px;

    margin-bottom:10px;

    border-left:6px solid;

}

.review-item.correct{

    background:#ecfdf5;

    border-color:#10b981;

}

.review-item.incorrect{

    background:#fff1f2;

    border-color:#ef4444;

}

.review-question{

    font-weight:bold;

    margin-bottom:7px;

}

.correct-answer{

    color:#059669;

    font-weight:bold;

}

.wrong-answer{

    color:#dc2626;

    font-weight:bold;

}


/* =====================================================
   HIDDEN
===================================================== */

.hidden{

    display:none !important;

}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:600px){

    header h1{

        font-size:26px;

    }

    .card{

        padding:17px;

    }

    .question{

        font-size:23px;

    }

    .clock{

        width:200px;

        height:200px;

    }

    .navigation{

        flex-direction:column;

    }

    .test-header{

        flex-direction:column;

        align-items:stretch;

    }

    .timer{

        width:100%;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

<h1>🧮 Math Adventure</h1>

<p>Fun Math Practice for Grades 1–7 ⭐</p>

</header>


<div class="container">


<!-- =====================================================
     SETUP SCREEN
===================================================== -->

<div id="setupScreen" class="card">

<h2 class="setup-title">
🎯 Choose Your Math Practice
</h2>


<div class="option-grid">


<!-- GRADE -->

<div class="option">

<label>📚 Grade</label>

<select id="gradeSelect">

<option value="1">Grade 1</option>

<option value="2">Grade 2</option>

<option value="3">Grade 3</option>

<option value="4">Grade 4</option>

<option value="5">Grade 5</option>

<option value="6">Grade 6</option>

<option value="7">Grade 7</option>

</select>

</div>


<!-- QUESTIONS -->

<div class="option">

<label>🔢 Number of Questions</label>

<select id="questionCount">

<option value="5">
5 Questions
</option>

<option value="10" selected>
10 Questions
</option>

<option value="15">
15 Questions
</option>

<option value="20">
20 Questions
</option>

</select>

</div>


<!-- TIMER -->

<div class="option">

<label>⏱ Test Time</label>

<select id="timeLimit">

<option value="0">
No Timer
</option>

<option value="5">
5 Minutes
</option>

<option value="10" selected>
10 Minutes
</option>

<option value="15">
15 Minutes
</option>

<option value="20">
20 Minutes
</option>

</select>

</div>


<!-- ANSWER TYPE -->

<div class="option">

<label>✏️ Answer Type</label>

<select id="answerType">

<option value="choice">
🔘 Multiple Choice
</option>

<option value="blank">
✏️ Fill in the Blank
</option>

<option value="mixed">
🎲 Mixed
</option>

</select>

</div>


</div>


<h3 class="topic-heading">
📖 Choose a Topic
</h3>


<div class="topic-grid">


<button
    class="topic-btn selected"
    data-topic="mixed">

🧩 Mixed Practice

</button>


<button
    class="topic-btn"
    data-topic="addition">

➕ Addition

</button>


<button
    class="topic-btn"
    data-topic="subtraction">

➖ Subtraction

</button>


<button
    class="topic-btn"
    data-topic="multiplication">

✖️ Multiplication

</button>


<button
    class="topic-btn"
    data-topic="division">

➗ Division

</button>


<button
    class="topic-btn"
    data-topic="fractions">

🍕 Fractions

</button>


<button
    class="topic-btn"
    data-topic="decimals">

🔢 Decimals

</button>


<button
    class="topic-btn"
    data-topic="word">

📖 Word Problems

</button>


<button
    class="topic-btn"
    data-topic="time">

🕐 Time

</button>


<button
    class="topic-btn"
    data-topic="comparison">

⚖️ Compare

</button>


</div>


<button
    class="main-btn"
    onclick="startTest()">

🚀 Start Math Test

</button>


</div>



<!-- =====================================================
     TEST SCREEN
===================================================== -->

<div id="testScreen"
     class="card hidden">


<div class="test-header">


<div class="progress-area">

<div
    class="progress-text"
    id="progressText">

Question 1 of 10

</div>


<div class="progress">

<div
    id="progressBar"
    class="progress-bar">

</div>

</div>

</div>


<div
    id="timer"
    class="timer">

⏱ 10:00

</div>


</div>


<div id="questionContainer">

</div>


<div class="navigation">


<button
    class="nav-btn previous"
    onclick="previousQuestion()">

⬅ Previous

</button>


<button
    class="nav-btn next"
    onclick="nextQuestion()">

Next ➡

</button>


</div>


</div>



<!-- =====================================================
     RESULT SCREEN
===================================================== -->

<div id="resultScreen"
     class="card hidden">


<div class="result">


<h2>🎉 Test Complete!</h2>


<div class="score-circle">

<div
    class="score-number"
    id="scorePercent">

0%

</div>

<div>Score</div>

</div>


<div
    class="result-message"
    id="resultMessage">

Great Job!

</div>


<div
    class="result-details"
    id="resultDetails">

</div>


<button
    class="main-btn"
    onclick="newTest()">

🔄 Start New Test

</button>


</div>


<div class="review">

<h2>📝 Review Your Answers</h2>

<div id="reviewContainer">

</div>

</div>


</div>


</div>



<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let selectedTopic = "mixed";

let questions = [];

let answers = [];

let currentQuestion = 0;

let testTimer = null;

let remainingSeconds = 0;


/* =====================================================
   TOPIC BUTTONS
===================================================== */

document
.querySelectorAll(".topic-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".topic-btn")
            .forEach(btn => {

                btn.classList.remove(
                    "selected"
                );

            });


            this.classList.add(
                "selected"
            );


            selectedTopic =
                this.dataset.topic;

        }
    );

});


/* =====================================================
   START TEST
===================================================== */

function startTest(){

    const grade =
        parseInt(
            document
            .getElementById(
                "gradeSelect"
            )
            .value
        );


    const count =
        parseInt(
            document
            .getElementById(
                "questionCount"
            )
            .value
        );


    const minutes =
        parseInt(
            document
            .getElementById(
                "timeLimit"
            )
            .value
        );


    const answerType =
        document
        .getElementById(
            "answerType"
        )
        .value;


    questions = [];

    answers = [];

    currentQuestion = 0;


    for(
        let i = 0;
        i < count;
        i++
    ){

        questions.push(
            generateQuestion(
                grade,
                selectedTopic,
                answerType
            )
        );

    }


    document
    .getElementById(
        "setupScreen"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "resultScreen"
    )
    .classList.add(
        "hidden"
    );


    document
    .getElementById(
        "testScreen"
    )
    .classList.remove(
        "hidden"
    );


    if(minutes > 0){

        remainingSeconds =
            minutes * 60;

        startTimer();

    }
    else{

        clearInterval(testTimer);

        document
        .getElementById(
            "timer"
        )
        .textContent =
            "⏱ No Timer";

    }


    showQuestion();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

    clearInterval(testTimer);

    updateTimerDisplay();


    testTimer =
        setInterval(
            function(){

                remainingSeconds--;

                updateTimerDisplay();


                if(
                    remainingSeconds <= 0
                ){

                    clearInterval(
                        testTimer
                    );


                    alert(
                        "⏰ Time is up!"
                    );


                    finishTest();

                }

            },
            1000
        );

}


function updateTimerDisplay(){

    const timer =
        document
        .getElementById(
            "timer"
        );


    if(
        remainingSeconds <= 0
    ){

        timer.textContent =
            "⏰ 0:00";

        return;

    }


    const minutes =
        Math.floor(
            remainingSeconds / 60
        );


    const seconds =
        remainingSeconds % 60;


    timer.textContent =
        "⏱ " +
        minutes +
        ":" +
        String(seconds)
        .padStart(
            2,
            "0"
        );


    if(
        remainingSeconds <= 60
    ){

        timer.classList.add(
            "warning"
        );

    }
    else{

        timer.classList.remove(
            "warning"
        );

    }

}


/* =====================================================
   GENERATE QUESTION
===================================================== */

function generateQuestion(
    grade,
    topic,
    answerType
){

    let actualTopic =
        topic;


    if(
        topic === "mixed"
    ){

        const topics =
            getAvailableTopics(
                grade
            );


        actualTopic =
            topics[
                randomInt(
                    0,
                    topics.length - 1
                )
            ];

    }


    let question;


    switch(actualTopic){

        case "addition":

            question =
                additionQuestion(
                    grade
                );

            break;


        case "subtraction":

            question =
                subtractionQuestion(
                    grade
                );

            break;


        case "multiplication":

            question =
                multiplicationQuestion(
                    grade
                );

            break;


        case "division":

            question =
                divisionQuestion(
                    grade
                );

            break;


        case "fractions":

            question =
                fractionQuestion(
                    grade
                );

            break;


        case "decimals":

            question =
                decimalQuestion(
                    grade
                );

            break;


        case "word":

            question =
                wordQuestion(
                    grade
                );

            break;


        case "time":

            question =
                timeQuestion(
                    grade
                );

            break;


        case "comparison":

            question =
                comparisonQuestion(
                    grade
                );

            break;


        default:

            question =
                additionQuestion(
                    grade
                );

    }


    /* ---------------------------------------------
       ANSWER MODE
    --------------------------------------------- */


    if(
        answerType === "choice"
    ){

        question.answerMode =
            "choice";

    }


    else if(
        answerType === "blank"
    ){

        question.answerMode =
            "blank";

    }


    else{

        question.answerMode =
            Math.random() < 0.5
            ? "choice"
            : "blank";

    }


    return question;

}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion(){

    const q =
        questions[
            currentQuestion
        ];


    document
    .getElementById(
        "progressText"
    )
    .textContent =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        questions.length;


    document
    .getElementById(
        "progressBar"
    )
    .style.width =
        (
            (
                currentQuestion + 1
            )
            /
            questions.length
            *
            100
        ) + "%";


    const container =
        document
        .getElementById(
            "questionContainer"
        );


    let html = `

        <div class="question-number">

            ${q.type}

        </div>

    `;


    /* CLOCK */

    if(
        q.type === "Time"
    ){

        html +=
            createClockHTML(
                q.hour,
                q.minute
            );

    }


    /* QUESTION TEXT */

    html += `

        <div class="question">

            ${q.question}

        </div>

    `;


    /* ANSWER MODE LABEL */

    if(
        q.answerMode === "choice"
    ){

        html += `

            <div class="answer-mode-label">

                Choose the correct answer

            </div>

        `;

    }
    else{

        html += `

            <div class="answer-mode-label">

                Type your answer below

            </div>

        `;

    }


    /* MULTIPLE CHOICE */

    if(
        q.answerMode === "choice"
        &&
        q.options
    ){

        html +=
            `<div class="answer-grid">`;


        q.options.forEach(
            option => {

                const selected =
                    String(
                        answers[
                            currentQuestion
                        ]
                    ) ===
                    String(option)
                    ? "selected"
                    : "";


                html += `

                    <button
                        class="answer-btn ${selected}"
                        onclick="
                            selectAnswer(
                                this,
                                '${escapeString(option)}'
                            )
                        ">

                        ${option}

                    </button>

                `;

            }
        );


        html +=
            `</div>`;

    }


    /* FILL IN THE BLANK */

    else{

        const existing =
            answers[
                currentQuestion
            ] || "";


        html += `

            <div class="text-answer">

                <input
                    type="text"
                    id="textAnswer"
                    value="${existing}"
                    placeholder="Type your answer"
                    autocomplete="off">

            </div>

        `;

    }


    container.innerHTML =
        html;


    /* FOCUS INPUT */

    const input =
        document
        .getElementById(
            "textAnswer"
        );


    if(input){

        input.focus();


        input.addEventListener(
            "input",
            function(){

                answers[
                    currentQuestion
                ] =
                    this.value;

            }
        );


        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Enter"
                ){

                    nextQuestion();

                }

            }
        );

    }

}


/* =====================================================
   ESCAPE STRING
===================================================== */

/* =====================================================
   CHECK ANSWER
===================================================== */

function isCorrectAnswer(
    userAnswer,
    correctAnswer
){

    if(
        userAnswer === undefined ||
        userAnswer === null ||
        String(userAnswer).trim() === ""
    ){

        return false;

    }


    const user =
        String(userAnswer)
        .trim()
        .toLowerCase();


    const correct =
        String(correctAnswer)
        .trim()
        .toLowerCase();


    /* NUMERIC ANSWERS */

    const userNumber =
        Number(user);


    const correctNumber =
        Number(correct);


    if(
        !Number.isNaN(userNumber)
        &&
        !Number.isNaN(correctNumber)
        &&
        user !== ""
    ){

        return (
            Math.abs(
                userNumber -
                correctNumber
            ) < 0.000001
        );

    }


    return user === correct;

}


/* =====================================================
   REVIEW
===================================================== */

function createReview(){

    const container =
        document
        .getElementById(
            "reviewContainer"
        );


    container.innerHTML = "";


    questions.forEach(
        (q,index) => {

            const userAnswer =
                answers[index] ||
                "No Answer";


            const correct =
                isCorrectAnswer(
                    userAnswer,
                    q.answer
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "review-item " +
                (
                    correct
                    ? "correct"
                    : "incorrect"
                );


            div.innerHTML = `

                <div class="review-question">

                    ${index + 1}.
                    ${q.question}

                </div>

                <div>

                    Your answer:

                    <span class="${
                        correct
                        ? "correct-answer"
                        : "wrong-answer"
                    }">

                        ${userAnswer}

                    </span>

                </div>

                ${
                    correct
                    ? ""
                    : `

                    <div>

                        Correct answer:

                        <span class="correct-answer">

                            ${q.answer}

                        </span>

                    </div>

                    `
                }

            `;


            container.appendChild(
                div
            );

        }
    );

}

function randomInt(
    min,
    max
){

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;

}

/* =====================================================
   FRACTIONS
===================================================== */

function fractionQuestion(
    grade
){

    const denominator =
        randomInt(
            2,
            grade >= 6 ? 12 : 8
        );


    const numerator =
        randomInt(
            1,
            denominator - 1
        );


    if(
        grade <= 4
    ){

        return {

            type:"Fractions",

            question:
                `Which fraction represents ` +
                `${numerator} out of ${denominator}?`,

            answer:
                `${numerator}/${denominator}`,

            options:[
                `${numerator}/${denominator}`,
                `${numerator + 1}/${denominator}`,
                `${numerator}/${denominator + 1}`,
                `${denominator}/${numerator}`
            ]

        };

    }


    const n2 =
        randomInt(
            1,
            9
        );


    const d2 =
        randomInt(
            2,
            10
        );


    const value =
        (
            numerator / denominator
            +
            n2 / d2
        );


    const answer =
        Math.round(
            value * 100
        ) / 100;


    return {

        type:"Fractions",

        question:
            `${numerator}/${denominator} + ` +
            `${n2}/${d2} ≈ ?`,

        answer:answer,

        options:
            makeNumberOptions(
                answer
            )

    };

}

   DECIMALS

function decimalQuestion(
    grade
){

    const a =
        randomInt(

    const b =
        randomInt(
            1,
            grade <= 5 ? 99 : 999
        ) / 10;


    const answer =
        Math.round(

        ) / 100;


    return {

        type:"Decimals",

        question:
            `${a} + ${b} = ?`,

        answer:answer,

        options:
            makeNumberOptions(
                answer
            )

    };

}

/* =====================================================
   FORMAT TIME
===================================================== */

function formatTime(
    hour,
    minute
){

    return (
        hour +
        ":" +
        String(minute)
        .padStart(
            2,
            "0"
        )
    );

}


/* =====================================================
   CLOCK HTML
===================================================== */

function createClockHTML(
    hour,
    minute
){

    const minuteAngle =
        minute * 6;


    const hourAngle =
        (
            hour % 12
        ) * 30 +
        minute * .5;


    let numbers = "";


    for(
        let i = 1;
        i <= 12;
        i++
    ){

        numbers += `

            <div
                class="clock-number clock-${i}">

                ${i}

            </div>

        `;

    }


    return `

        <div class="clock-question">

            <div class="clock">

                ${numbers}


                <div
                    class="hand hour-hand"
                    style="
                        transform:
                        translateX(-50%)
                        rotate(${hourAngle}deg);
                    ">

                </div>


                <div
                    class="hand minute-hand"
                    style="
                        transform:
                        translateX(-50%)
                        rotate(${minuteAngle}deg);
                    ">

                </div>


                <div class="clock-center">

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   TIME OPTIONS
===================================================== */

function makeTimeOptions(
    hour,
    minute
){

    const correct =
        formatTime(
            hour,
            minute
        );


    const options =
        [correct];


    while(
        options.length < 4
    ){

        const h =
            randomInt(
                1,
                12
            );


        const m =
            randomInt(
                0,
                11
            ) * 5;


        const value =
            formatTime(
                h,
                m
            );


        if(
            !options.includes(
                value
            )
        ){

            options.push(
                value
            );

        }

    }


    return shuffle(
        options
    );

}


/* =====================================================
   NUMBER OPTIONS
===================================================== */

function makeNumberOptions(
    answer
){

    const numeric =
        Number(answer);


    const options =
        [numeric];


    let safety = 0;


    while(
        options.length < 4
        &&
        safety < 100
    ){

        safety++;


        let difference;


        if(
            Math.abs(numeric) < 10
        ){

            difference =
                randomInt(
                    1,
                    5
                );

        }

        else{

            difference =
                randomInt(
                    1,
                    Math.max(
                        5,
                        Math.floor(
                            Math.abs(
                                numeric
                            ) * .2
                        )
                    )
                );

        }


        const value =
            numeric +
            (
                Math.random() < .5
                ? -difference
                : difference
            );


        if(
            value >= 0
            &&
            !options.includes(
                value
            )
        ){

            options.push(
                value
            );

        }

    }


    return shuffle(
        options.map(
            String
        )
    );

}

function comparisonQuestion(
    grade
){

    let max;


    if(
        grade <= 2
    ){

        max = 50;

    }

    else if(
        grade <= 4
    ){

        max = 1000;

    }

    else{

        max = 100000;

    }

        randomInt(
            1,
            max
        );


    const b =
        randomInt(
            1,
            max
        );

        answer = ">";

    }

    }

        answer:answer,

        options:[
            ">",
            "<",
            "="
        ]

    };

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(
    array
){

    return array.sort(
        () =>
            Math.random() - .5
    );

}
