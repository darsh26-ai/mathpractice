<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Practice Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Math Practice Test</h1>
    <button id="themeButton">Dark Mode</button>
</header>

<div class="container">

    <!-- HOME PAGE (Grade Selection) -->
    <section id="homePage">
        <h2>Select Grade</h2>
        <div id="gradeGrid"></div>
    </section>

    <!-- TOPIC PAGE -->
    <section id="topicPage" class="hidden">
        <h2>Select Topic</h2>
        <div id="topicGrid"></div>
        <button class="backButton">Back</button>
    </section>

    <!-- SETTINGS PAGE -->
    <section id="settingsPage" class="hidden">
        <h2>Practice Settings</h2>

        <label>
            Difficulty:
            <select id="difficulty">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
        </label>

        <label>
            Question Type:
            <select id="questionType">
                <option value="mcq">Multiple Choice</option>
                <option value="typed">Type the Answer</option>
            </select>
        </label>

        <label>
            Number of Questions:
            <select id="questionCount">
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
            </select>
        </label>

        <label>
            Timer (optional):
            <select id="timer">
                <option value="0">No Timer</option>
                <option value="30">30 seconds</option>
                <option value="60">1 minute</option>
                <option value="120">2 minutes</option>
            </select>
        </label>

        <button id="startPracticeBtn">Start Practice</button>
        <button class="backButton">Back</button>
    </section>

    <!-- QUIZ PAGE -->
    <section id="quizPage" class="hidden">
        <h2 id="practiceTitle"></h2>

        <div id="clockContainer"></div>

        <div id="questionBox"></div>

        <div id="optionsBox"></div>

        <input id="typedAnswer" class="hidden" placeholder="Type your answer">

        <div id="resultBox"></div>

        <button id="nextBtn">Next</button>
        <button class="backButton">Back</button>
    </section>

    <!-- RESULTS PAGE -->
    <section id="resultsPage" class="hidden">
        <h2>Quiz Results</h2>

        <div id="scoreBox"></div>

        <button id="restartButton">Restart Quiz</button>
        <button id="homeButton">Home</button>
    </section>

</div>

<script src="app.js"></script>
<script src="generator.js"></script>
<script src="practice.js"></script>

</body>
</html>
